steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/trello-mcp-server', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/trello-mcp-server']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trello-mcp-server'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/trello-mcp-server'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # No --set-env-vars: a deploy without env flags inherits the env vars of the
      # current revision. Passing them here meant that a build submitted without
      # substitutions silently wiped TRELLO_API_KEY / TRELLO_API_TOKEN /
      # MCP_ACCESS_TOKEN / REDIS_* on the live service. Manage them in the Cloud Run
      # console, or with an explicit `gcloud run services update --update-env-vars`.

images:
  - 'gcr.io/${PROJECT_ID}/trello-mcp-server'

options:
  substitutionOption: 'ALLOW_LOOSE'
